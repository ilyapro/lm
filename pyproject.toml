[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "living-memory"
version = "0.1.0"
description = "SQLite foundation for a Living Memory MCP server."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Living Memory contributors" }]
dependencies = ["fastmcp>=2.0", "sentence-transformers>=2.2"]

[project.optional-dependencies]
test = ["pytest>=8"]
embeddings = ["sentence-transformers>=2.2"]
dev = ["pytest>=8", "sentence-transformers>=2.2"]

[project.scripts]
living-memory-server = "living_memory.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
